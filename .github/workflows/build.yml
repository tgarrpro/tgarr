name: Build & Publish Docker Image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax-check every Python file
        run: python -W error::SyntaxWarning -m compileall -q api crawler registry tools || python -m compileall -q api crawler registry tools
      - name: Parser regression tests
        working-directory: crawler
        run: python test_parser.py && python test_tme.py && python test_library.py
      - name: Update-notice and operator-panel tests
        run: |
          pip install -q fastapi==0.115.0 asyncpg==0.30.0 python-multipart==0.0.12 httpx
          (cd api && python test_update.py && python test_access.py && python test_usenet.py && python test_screentime.py && python test_export.py && python test_localfiles.py && python test_names.py && python test_usenet_scan.py && python test_tts_text.py && python test_vision.py && python test_usenet_fetch.py && python test_usenet_shelf.py && python test_usenet_guard.py)
          (cd registry && python test_admin.py && python test_webcrawl.py && python test_seeds.py)

  build:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [crawler, api]
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/tgarr-${{ matrix.component }}
          tags: |
            # Release channels:
            #   main        -> :edge  (+ :sha-xxxxxxx)   what is being tested
            #   tag vX.Y.Z  -> :latest, :X.Y.Z, :X.Y    what watchtower installs
            # A push to main no longer reaches every install; cutting a tag
            # does, and the previous :X.Y.Z stays available for rollback.
            type=raw,value=edge,enable={{is_default_branch}}
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.component }}
          # A run started by hand is a test image for one machine: build it
          # for amd64 only. arm64 is emulated and takes most of an hour for
          # the api image whenever its big layer is rebuilt. Releases (main,
          # tags) and pull requests still build both.
          platforms: ${{ github.event_name == 'workflow_dispatch' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # test builds keep a cache of their own, so they cannot push the
          # release build's layers out of it
          cache-from: type=gha,scope=${{ matrix.component }}${{ github.event_name == 'workflow_dispatch' && '-test' || '' }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}${{ github.event_name == 'workflow_dispatch' && '-test' || '' }}
